{% if qr_svg %}
<div class="qr-certif-bloc" style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:8px 12px;border:1px dashed #cbd5e1;border-radius:8px;background:#f8fafc;page-break-inside:avoid;">
  <div style="display:flex;align-items:center;gap:10px;">
    <div style="background:#fff;padding:3px;border:1px solid #e2e8f0;border-radius:6px;line-height:0;">
      {{ qr_svg }}
    </div>
    <div style="font-size:10px;color:#475569;line-height:1.45;">
      <div style="font-weight:800;color:#0f172a;text-transform:uppercase;letter-spacing:0.4px;">Document Authentifié par QR Code Signé</div>
      <div>Scannez ce code pour vérifier l'authenticité et la moyenne officielle en ligne.</div>
      <div style="font-family:monospace;font-size:9.5px;color:#64748b;margin-top:2px;">Code de contrôle : <strong>#{{ qr_code_court }}</strong></div>
    </div>
  </div>
  <div style="text-align:right;font-size:9.5px;color:#64748b;">
    <a href="{{ qr_url }}" target="_blank" style="color:#1565C0;text-decoration:none;font-weight:700;">Vérifier en ligne →</a>
  </div>
</div>
{% endif %}
