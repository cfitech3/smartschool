<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance en cours — SmartSchool</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #e8eef4; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; color: #1e293b; text-align: center; }
    .box { background: #fff; padding: 50px 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 500px; width: 90%; }
    .icon { font-size: 60px; margin-bottom: 20px; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    h1 { font-size: 24px; font-weight: 800; color: #0f172a; margin-bottom: 15px; }
    p { font-size: 15px; color: #475569; line-height: 1.6; margin-bottom: 30px; }
    .btn { background: #1565C0; color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 14px; transition: background 0.2s; display: inline-block; }
    .btn:hover { background: #0D47A1; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon"></div>
    <h1>Système en maintenance</h1>
    <p>Nous effectuons actuellement une mise à jour critique de SmartSchool. La plateforme sera de retour d'ici quelques minutes.<br><br>Merci de votre patience !</p>
    <a href="/" class="btn">Réessayer</a>
  </div>
</body>
</html>
